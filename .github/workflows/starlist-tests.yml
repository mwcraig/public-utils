name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'schemas/starlist/**'
      - '.github/workflows/starlist-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'schemas/starlist/**'
      - '.github/workflows/starlist-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: schemas/starlist
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run tests
        run: uv run pytest

  schema-files:
    # Guard against stale generated files and schema changes without a
    # SCHEMA_VERSION bump. Only meaningful for PRs, where there is a base ref.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schemas/starlist
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check generated schema files are current
        run: |
          uv run poe generate
          git diff --exit-code -- data/

      - name: Check archived schema files are unchanged
        # data/v<version>/ is the permanent record of each schema version. A PR
        # may add an archive but never modify or delete one.
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff --exit-code --name-only --diff-filter=MD \
            origin/${{ github.base_ref }}... -- 'data/v*/'
